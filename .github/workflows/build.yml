name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y cmake libmbedtls-dev libsodium-dev libopus-dev libssl-dev
      - name: Cache DAVE dependencies
        uses: actions/cache@v4
        with:
          path: deps/linux
          key: deps-linux-${{ hashFiles('scripts/build-deps.sh') }}
      - name: Build
        run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nxcord-cli-linux-x86_64
          path: build-linux/platform/linux/nxcord-cli
